name: Build and Deploy PhotoWall

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_OSS_PHOTOWALL_BASE_URL=${{ vars.VITE_OSS_PHOTOWALL_BASE_URL }}
            VITE_PHOTO_UPLOAD_MAX_FILES_PER_BATCH=${{ vars.VITE_PHOTO_UPLOAD_MAX_FILES_PER_BATCH || '3' }}
            VITE_PHOTO_UPLOAD_BATCH_MB=${{ vars.VITE_PHOTO_UPLOAD_BATCH_MB || '30' }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass
          install -m 700 -d ~/.ssh
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload compose file
        shell: bash
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="~/photowall"
          fi

          sshpass -p "${{ secrets.SSH_PASSWORD }}" scp -P "${{ secrets.SSH_PORT || '22' }}" docker-compose.prod.yml "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/photowall-docker-compose.prod.yml"
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'EOF'
          set -euo pipefail
          DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"
          mkdir -p "$DEPLOY_PATH/src/data"
          mv /tmp/photowall-docker-compose.prod.yml "$DEPLOY_PATH/docker-compose.prod.yml"
          EOF

      - name: Deploy on server
        shell: bash
        run: |
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          if [ -z "$DEPLOY_PATH" ]; then
            DEPLOY_PATH="~/photowall"
          fi

          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -p "${{ secrets.SSH_PORT || '22' }}" "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='$DEPLOY_PATH' PHOTOWALL_IMAGE='${{ needs.build.outputs.image }}' GHCR_USERNAME='${{ secrets.GHCR_USERNAME }}' GHCR_TOKEN='${{ secrets.GHCR_TOKEN }}' bash -s" <<'EOF'
          set -euo pipefail

          DEPLOY_PATH="${DEPLOY_PATH/#\~/$HOME}"
          cd "$DEPLOY_PATH"
          mkdir -p src/data
          chown -R 1000:1000 src/data 2>/dev/null || chmod -R a+rwX src/data

          if [ ! -f .env ]; then
            echo "Missing $DEPLOY_PATH/.env"
            echo "Create it on the server before deploying."
            exit 1
          fi

          export PHOTOWALL_IMAGE

          if [ -n "${GHCR_TOKEN:-}" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USERNAME:-$USER}" --password-stdin
          fi

          docker compose -f docker-compose.prod.yml pull photowall

          if [ ! -s src/data/site-settings.json ]; then
            echo "site-settings.json is missing or empty, creating default settings..."
            cat > src/data/site-settings.json <<'JSON'
          {
            "siteTitle": "照片墙",
            "galleryTitle": "人生是不断的回忆",
            "favicon": "/resources/fangnai.jpg"
          }
          JSON
            chown 1000:1000 src/data/site-settings.json 2>/dev/null || chmod a+rw src/data/site-settings.json
          else
            echo "site-settings.json exists, skip default settings creation."
          fi

          if [ ! -s src/data/images-metadata.json ]; then
            echo "images-metadata.json is missing or empty, rebuilding it from OSS..."
            docker compose -f docker-compose.prod.yml run --rm photowall npm run rebuild-oss-metadata
          else
            echo "images-metadata.json exists, skip OSS metadata sync."
          fi

          docker compose -f docker-compose.prod.yml up -d
          sleep 5
          docker compose -f docker-compose.prod.yml ps photowall
          if [ -z "$(docker compose -f docker-compose.prod.yml ps --status running -q photowall)" ]; then
            echo "PhotoWall container is not running. Recent logs:"
            docker compose -f docker-compose.prod.yml logs --tail=120 photowall
            exit 1
          fi

          docker image prune -f
          EOF
